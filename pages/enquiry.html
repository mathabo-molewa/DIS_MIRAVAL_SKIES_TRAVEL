<h1 style="text-align: center;">Inquiry Form</h1>
 <!--Create a form-->
<form action="#" method="post" style="text-align: center;">
    <Label for="name" name="name">Your Name:</Label><br/>
    <input type="text" id="name" placeholder="Tell us who you are" required>
    <br/><br/>

    <Label for="email" name="email">Email Address:</Label><br/>
    <input type="email" id="email" placeholder="Enter your email address" required>
    <br/><br/>    

    <Label for="travel" name="travel">Travel type:</Label><br/>

    <select id="travel" name="travel" required>
        <option value="">Select travel type</option>
        <option value="domestic trip">Domestic</option>
        <option value="international trip">International</option>
        <option value="cruise">Cruise</option>
        <option value ="corporate Travel">Corporate</option>

    </select>
    <br/><br/>

    <label for="destination">Destination:</label><br/>
    <input type="text" id="destination" name="destination" placeholder="Where would you like to go?" required>
    <br/><br/>

    <label for="Number_Travellers" name="Number_Travellers">Number of Travellers:</label><br/>
    <input type="number" id="Number_Travellers" name="Number_Travellers" placeholder="How many people are travelling?" required>
    <br/><br/>

    <label for="travel_dates" name="travel_dates">Travel Dates:</label><br/>
    <input type="text" id="travel_dates" name="travel_dates" placeholder="Please provide your preferred travel dates" required>
    <br/><br/>

    <Label for="budget" name="budget"> Estimated Budget:</Label><br/>
    <input type="number" name="budget" min="0" placeholder="What is your estimated budget?" required>

    currency: <select name="currency" required>
        <option value="">Select currency</option>
        <option value="USD">USD</option>
        <option value="EUR">EUR</option>
        <option value="GBP">GBP</option>
        <option value="ZAR">ZAR</option>
        <option value="JPY">JPY</option>
        <option value="AUD">AUD</option>
        <optgroup label="Other Currencies">
            <option value="CAD">CAD</option>
            <option value="CHF">CHF</option>
            <option value="CNY">CNY</option>
            <option value="INR">INR</option>
            <option value="BRL">BRL</option>
            <option value="MXN">MXN</option>
            <option value="NZD">NZD</option>
            <option value="SGD">SGD</option>
            <option value="SEK">SEK</option>
            <option value="NOK">NOK</option>
        </select>
<br/><br/>


<Label for="message" name="message">Message:</Label><br/>
<textarea name="message" rows="10" cols="40" placeholder="Please tell us any additional information or special requests you have" required></textarea>


</textarea>
<br/><br/>
<button type="submit" style="background-color: maroon; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">Submit</button>
</optgroup>



    
</body>
